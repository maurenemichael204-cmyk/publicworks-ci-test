name: PublicWorks
options:
  bundleIdPrefix: com.example
  preferredProjectObjectVersion: 54   # Xcode 13-15 可读取的工程格式（runner 为 Xcode 15.4）
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"           # → CFBundleShortVersionString
    CURRENT_PROJECT_VERSION: "1"       # → CFBundleVersion（模拟器安装必需）
targets:
  PublicWorks:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"        # ad-hoc 签名：securityd 需有效签名才授予 Keychain 访问组(-34018)
        CODE_SIGNING_REQUIRED: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleVersion: "1"                 # 模拟器安装强校验：缺失会导致安装失败(POSIX 22)
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
  PublicWorksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PublicWorks
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  PublicWorks:
    build:
      targets:
        PublicWorks: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PublicWorksUITests
