name: iOS UI Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Mock 依赖
        run: python -m pip install --quiet fastapi uvicorn cryptography

      - name: 生成自签证书并启动 TLS Mock (:8443)
        run: |
          cd mock
          python ../tools/generate_cert.py
          nohup python -m uvicorn mock_server:app --host 127.0.0.1 --port 8443 \
            --ssl-keyfile key.pem --ssl-certfile cert.pem > mock.log 2>&1 &
          sleep 3
          curl -sk https://127.0.0.1:8443/v1/users/probe/public-works \
            -H "Authorization: Bearer dev-only-token" | head -c 120

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 启动模拟器并信任证书
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl keychain booted add-root-cert "$PWD/mock/cert.pem"

      - name: 运行 UI 回归测试
        run: |
          xcodebuild test \
            -project PublicWorks.xcodeproj \
            -scheme PublicWorks \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild.log

      - name: 失败时保留 Mock 日志与构建日志
        if: failure()
        run: |
          echo "── mock server log ──"
          cat mock/mock.log || true

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
