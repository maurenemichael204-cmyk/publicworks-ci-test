name: iOS UI Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Mock 依赖
        run: python -m pip install --quiet fastapi uvicorn cryptography

      - name: 生成自签证书并启动 TLS Mock (:8443)
        run: |
          cd mock
          python ../tools/generate_cert.py
          nohup python -m uvicorn mock_server:app --host 127.0.0.1 --port 8443 \
            --ssl-keyfile key.pem --ssl-certfile cert.pem > mock.log 2>&1 &
          sleep 3
          curl -sk https://127.0.0.1:8443/v1/users/probe/public-works \
            -H "Authorization: Bearer dev-only-token" | head -c 120

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          # brew 新版 XcodeGen 固定写 objectVersion=77（Xcode16 格式），
          # runner 的 Xcode 15.4 读不了：降为 56 并删掉 16 专属属性行。
          sed -i '' 's/objectVersion = 77/objectVersion = 56/' PublicWorks.xcodeproj/project.pbxproj
          sed -i '' '/minimizedProjectReferenceProxies/d; /preferredProjectObjectVersion/d' PublicWorks.xcodeproj/project.pbxproj
          grep -m1 objectVersion PublicWorks.xcodeproj/project.pbxproj

      - name: 启动模拟器并信任证书
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl keychain booted add-root-cert "$PWD/mock/cert.pem"

      - name: 预编译并自检 Info.plist
        run: |
          set -o pipefail
          xcodebuild build \
            -project PublicWorks.xcodeproj \
            -scheme PublicWorks \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -quiet 2>&1 | tee build.log
          # -showBuildSettings 不认 destination（上一轮它返回了 Debug-iphoneos，
          # 真机目录必然不存在导致误报）。改为直接定位模拟器产物。
          PLIST=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*Debug-iphonesimulator/PublicWorks.app/Info.plist" | head -1)
          echo "── $PLIST ──"
          plutil -p "$PLIST" > plist.txt   # 先落盘再 grep，避开 pipefail+grep-q 的 SIGPIPE 误判
          cat plist.txt
          grep -q CFBundleVersion plist.txt \
            || { echo "FATAL: generated Info.plist missing CFBundleVersion"; exit 1; }

      - name: 运行 UI 回归测试
        run: |
          set -o pipefail   # 没有这行，tee 会把 xcodebuild 的失败码吞成成功
          xcodebuild test \
            -project PublicWorks.xcodeproj \
            -scheme PublicWorks \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild.log

      - name: 失败时保留 Mock 日志与构建日志
        if: failure()
        run: |
          echo "── mock server log ──"
          cat mock/mock.log || true

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
